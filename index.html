<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>상현 여행 가계부 - 시작하기</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100dvh; background: #ffffff; display: flex; flex-direction: column; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #loading-overlay { backdrop-filter: blur(4px); }
    </style>
</head>
<body class="antialiased text-gray-800">
    <div class="app-container">
        <div id="screen-setup" class="flex-1 flex flex-col p-6 overflow-y-auto">
            <div class="text-center mt-8 mb-8">
                <i class="ph-fill ph-wallet text-6xl text-blue-500 mb-2"></i>
                <h1 class="text-2xl font-bold text-gray-900">여행 가계부 시작하기</h1>
                <p class="text-sm text-gray-500 mt-2">새로운 여행을 만들거나 기존 여행에 참여하세요.</p>
            </div>
            <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-teal-600">모든 여행 목록</h2>
                    <button type="button" onclick="loadAllTrips()" class="text-xs text-gray-500 flex items-center gap-1 active:scale-95"><i class="ph-bold ph-arrows-clockwise"></i> 새로고침</button>
                </div>
                <div id="all-trips-list" class="space-y-3 max-h-48 overflow-y-auto hide-scrollbar">
                    <div class="text-center text-sm text-gray-400 py-4">불러오는 중...</div>
                </div>
            </div>
            <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100 mb-6">
                <h2 class="text-lg font-bold mb-4 text-blue-600">새 여행 만들기</h2>
                <form id="form-create-trip" class="space-y-4">
                    <div><label class="block text-xs font-semibold text-gray-600 mb-1">여행 이름</label><input type="text" id="setup-name" required class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="예: 제주도 여름 휴가"></div>
                    <div><label class="block text-xs font-semibold text-gray-600 mb-1">여행 장소</label><input type="text" id="setup-location" required class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="예: 대한민국 제주도"></div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-semibold text-gray-600 mb-1">시작일</label><input type="date" id="setup-start" required class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all"></div>
                        <div><label class="block text-xs font-semibold text-gray-600 mb-1">종료일</label><input type="date" id="setup-end" required class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all"></div>
                    </div>
                    <div><label class="block text-xs font-semibold text-gray-600 mb-1">여행 멤버 (쉼표로 구분)</label><input type="text" id="setup-members" required class="w-full bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="예: 철수, 영희, 민수"></div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl py-3.5 mt-2 transition-colors active:scale-[0.98]">새 여행 생성하기</button>
                </form>
            </div>
            <div class="bg-gray-50 p-5 rounded-2xl border border-gray-100">
                <h2 class="text-lg font-bold mb-4 text-purple-600">기존 여행 참여하기 (초대코드)</h2>
                <form id="form-join-trip" class="flex gap-2">
                    <input type="text" id="join-trip-id" required class="flex-1 bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-purple-500 outline-none transition-all" placeholder="여행 코드 (Trip ID)">
                    <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl px-5 transition-colors active:scale-[0.98]">참여</button>
                </form>
            </div>
        </div>
        <div id="loading-overlay" class="absolute inset-0 bg-white/80 z-50 flex flex-col items-center justify-center hidden"><div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div><p id="loading-text" class="text-sm font-semibold text-gray-700">로딩 중...</p></div>
        <div id="toast" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-3 rounded-xl shadow-lg text-sm font-semibold opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2"><i class="ph-fill ph-check-circle text-green-400 text-lg"></i><span id="toast-msg">알림</span></div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        const appId = "1:793454515760:web:2c727f6567e378cd5ffff5";
        const firebaseConfig = { apiKey: "AIzaSyC5rDmh2nEMawp2kqnw_LycoH4QcdtKtB4", authDomain: "trip-budget-52f07.firebaseapp.com", projectId: "trip-budget-52f07", appId: appId };
        let app, db, auth, currentUser;
        async function init() {
            showLoading("앱 초기화 중...");
            try {
                app = initializeApp(firebaseConfig); db = getFirestore(app); auth = getAuth(app);
                await signInAnonymously(auth); currentUser = auth.currentUser;
                const savedTripId = localStorage.getItem('last_trip_id');
                if (savedTripId) { window.location.href = 'workspace.html'; return; }
                await loadAllTrips();
            } catch (error) { alertUI("초기화 실패. 새로고침 해주세요."); } finally { hideLoading(); }
            document.getElementById('form-create-trip').addEventListener('submit', handleCreateTrip);
            document.getElementById('form-join-trip').addEventListener('submit', handleJoinTrip);
        }
        window.loadAllTrips = async () => {
            if (!db) return;
            const listEl = document.getElementById('all-trips-list');
            listEl.innerHTML = '<div class="text-center text-sm text-gray-400 py-4">목록 불러오는 중...</div>';
            try {
                const snapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'trips'));
                if (snapshot.empty) { listEl.innerHTML = '<div class="text-center text-sm text-gray-400 py-4">생성된 여행이 없습니다.</div>'; return; }
                let trips = []; snapshot.forEach(doc => trips.push({ id: doc.id, ...doc.data() }));
                trips.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                listEl.innerHTML = trips.map(trip => `<div onclick="goToWorkspace('${trip.id}')" class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm cursor-pointer hover:border-teal-500 active:scale-95 transition-all text-left mb-3"><div class="flex justify-between items-start"><div class="min-w-0 pr-2"><h3 class="font-bold text-gray-800 text-sm truncate">${trip.name}</h3><p class="text-[10px] font-semibold text-blue-600 mt-1 truncate">${trip.location} • 멤버 ${trip.members ? trip.members.length : 0}명</p></div><span class="bg-gray-100 text-gray-500 text-[10px] px-2 py-1 rounded-md shrink-0">입장하기</span></div></div>`).join('');
            } catch (error) { listEl.innerHTML = '<div class="text-center text-sm text-red-400 py-4">목록을 불러오지 못했습니다.</div>'; }
        };
        window.goToWorkspace = (tripId) => { localStorage.setItem('last_trip_id', tripId); window.location.href = 'workspace.html'; };
        async function handleCreateTrip(e) {
            e.preventDefault(); if (!currentUser) return;
            const name = document.getElementById('setup-name').value, location = document.getElementById('setup-location').value;
            const start = document.getElementById('setup-start').value, end = document.getElementById('setup-end').value;
            const members = document.getElementById('setup-members').value.split(',').map(m => m.trim()).filter(m => m !== '');
            if(members.length === 0) return alertUI("최소 한 명의 멤버를 입력하세요.");
            const tripId = Math.random().toString(36).substring(2, 9);
            showLoading("여행 생성 중...");
            try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'trips', tripId), { name, location, dates: `${start} ~ ${end}`, members, budget: 0, budgetCurrency: 'KRW', createdAt: new Date().toISOString() }); goToWorkspace(tripId); } 
            catch (error) { alertUI("생성 중 오류가 발생했습니다."); } finally { hideLoading(); }
        }
        async function handleJoinTrip(e) {
            e.preventDefault(); const tripId = document.getElementById('join-trip-id').value.trim(); if (!tripId) return;
            showLoading("확인 중...");
            try { const docSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'trips', tripId)); if(docSnap.exists()) goToWorkspace(tripId); else alertUI("유효하지 않은 여행 코드(ID)입니다."); } 
            catch(e) { alertUI("참여 중 오류가 발생했습니다."); } finally { hideLoading(); }
        }
        function showLoading(text) { document.getElementById('loading-text').textContent = text; document.getElementById('loading-overlay').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading-overlay').classList.add('hidden'); }
        function alertUI(msg) { const toast = document.getElementById('toast'); document.getElementById('toast-msg').textContent = msg; toast.classList.remove('opacity-0'); toast.classList.add('opacity-100', 'translate-y-4'); setTimeout(() => { toast.classList.remove('opacity-100', 'translate-y-4'); toast.classList.add('opacity-0'); }, 3000); }
        init();
    </script>
</body>
</html>
